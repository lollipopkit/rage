[package]
name = "rage_ffi"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "The Rust `age` crate behind a C ABI for Dart's FFI"
publish = false

[lib]
name = "rage_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
age = { version = "0.11", features = ["armor"] }
# age embeds its translations with rust-embed, which otherwise records each
# file's mtime (the registry's unpack time): a reproducible build needs it fixed.
rust-embed = { version = "8.13", default-features = false, features = ["deterministic-timestamps"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
